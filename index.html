<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MagoDelL8</title>
<meta name="description" content="Ultime estrazioni, ritardi e statistiche di Lotto, SuperEnalotto, Vinci Casa e Win for Life.">
<meta name="theme-color" content="#2a5bd7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&text=MagoDelL8&display=swap">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mu:#6b7385;--ac:#2a5bd7;--ball:#e8edfb;--brand:#14532d;--sub:#e0009a}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212c;--tx:#e8ebf2;--mu:#98a0b3;--ac:#7aa2ff;--ball:#2a3350;--brand:#5fbf8a;--sub:#ff4fc3}}
*{box-sizing:border-box}
body{margin:0 auto;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:900px}
h1{font:700 32px/1.15 "Cinzel Decorative","Palatino Linotype",Georgia,serif;letter-spacing:.5px;color:var(--brand);margin:0 0 4px}.sub{font-style:italic;font-weight:600;font-size:17px;color:var(--sub);margin:0 0 8px}
h2{font-size:15px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:14px 0}
.card{background:var(--card);border-radius:12px;padding:14px}
:root{--bs:30px;--ts:1}
.dr h2{font-size:calc(15px*var(--ts))}.dr .mu,#out .mu,#sout .mu{font-size:calc(13px*var(--ts))}
.dr .w{font-size:calc(12px*var(--ts))}.dr .w>span:first-child{width:calc(62px*var(--ts))}
#out table{font-size:calc(15px*var(--ts))}
.b{display:inline-flex;width:var(--bs);height:var(--bs);border-radius:50%;background:var(--ball);align-items:center;justify-content:center;font-weight:600;margin:2px;font-size:calc(var(--bs)*.43)}
.zoom{display:flex;align-items:center;gap:8px;margin:10px 0 0}.zoom button{padding:4px 14px;font-weight:700}
.b.x{background:var(--ac);color:#fff}
.w{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}.w>span:first-child{width:62px;color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
select,input,button{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--mu);background:var(--card);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button:disabled{opacity:.6}
table{border-collapse:collapse;width:100%}td,th{padding:4px 8px;text-align:left;border-bottom:1px solid var(--ball)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}.nav button{padding:8px 18px;font-size:16px}
.bar{height:8px;background:var(--ac);border-radius:4px}
</style></head><body>
<h1>MagoDelL8</h1><p class="sub">App dedicata a mia Mamma Rosa</p><div class="mu" id="upd">Caricamento…</div>
<div class="zoom"><span class="mu">Dimensione numeri e scritte</span><button id="zm" aria-label="Riduci numeri e scritte" title="Riduci">A−</button><button id="zp" aria-label="Ingrandisci numeri e scritte" title="Ingrandisci">A+</button></div>
<div class="grid" id="cards"></div>
<div class="card"><h2>Richiedi statistica o combinazione</h2>
<div class="row">
<label>Gioco<select id="g"></select></label>
<label id="wl">Ruota<select id="w"></select></label>
<label>Richiesta<select id="t"></select></label>
<label>Quanti numeri<input id="n" type="number" min="1" value="6" style="width:80px"></label>
<label>Ultime N estrazioni<input id="last" type="number" min="1" placeholder="tutte" style="width:100px"></label>
<label>&nbsp;<button id="go">Calcola</button></label></div>
<div id="out"></div>
<p class="mu">Le estrazioni sono indipendenti: ritardi e frequenze non aumentano la probabilità di vincita. Strumento a scopo informativo.</p></div>
<div class="card" style="margin-top:12px"><h2>Cerca estrazione</h2>
<div class="row">
<label>Gioco<select id="sg"></select></label>
<label>Data<input id="sd" type="date"></label>
<label id="shl">Ora<select id="sh"></select></label>
<label>oppure n. estrazione<input id="sn" type="number" min="1" style="width:120px"></label>
<label>&nbsp;<button id="sgo">Cerca</button></label></div>
<div id="sout"></div></div>
<script src="app.js"></script>
</body></html>
