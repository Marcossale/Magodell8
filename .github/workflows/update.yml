name: Aggiorna estrazioni

on:
  schedule:
    - cron: '10 * * * *'   # ogni ora, al minuto 10 (24 ore su 24, orario UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-estrazioni
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Commit se ci sono novità
        run: |
          git config user.name "magodel8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Dati: aggiornamento estrazioni" && git push)
