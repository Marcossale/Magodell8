name: Aggiorna estrazioni

on:
  schedule:
    - cron: '10 8-21 * * *'   # ogni ora al minuto 10, dalle 08 alle 21 UTC (copre le estrazioni serali e Win for Life)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-estrazioni
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Commit se ci sono novità
        run: |
          git config user.name "magodel8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Dati: aggiornamento estrazioni" && git push)
